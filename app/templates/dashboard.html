<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Image Receiver</title><link rel="stylesheet" href="/static/dashboard.css"></head><body><main><header><div><p class="eyebrow">AUTHORIZED IMAGE MANAGEMENT</p><h1>Live Image Receiver</h1><p class="muted">View and manage images received from connected devices</p></div><div class="auth"><input id="adminToken" type="password" placeholder="Administrator token"><button onclick="saveToken()">Unlock</button></div></header><section class="stats"><div><span>Images received</span><strong id="total">—</strong></div><div><span>Registered devices</span><strong id="devices">—</strong></div><div><span>Storage used</span><strong id="storage">—</strong></div><div><span>Latest upload</span><strong id="latest">—</strong></div></section><section class="toolbar"><input id="search" placeholder="Search filenames…" oninput="page=1;loadImages()"><button class="danger" onclick="cleanup()">Delete all images</button></section><section class="layout"><div><div id="gallery" class="gallery"></div><div id="pagination"></div></div><aside><h2>Recent activity</h2><div id="activity" class="activity"></div><h2>Devices</h2><div id="deviceTable"></div></aside></section></main><div id="toast"></div><script src="/static/dashboard.js"></script></body></html>
